# Reference environment (the one the paper's results were produced in: Python 3.11, PyTorch 2.7.1 + CUDA 11.8).
#   micromamba env create -f environment.yml        (or: conda env create -f environment.yml)
#   micromamba activate slicegaussian
#   SLICEGAUSSIAN_BUILD_CUDA=1 pip install -e . --no-build-isolation
# nvcc 11.8 needs a host compiler no newer than gcc 11; gxx_linux-64 provides it and sets CC/CXX on activation.
name: slicegaussian
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
dependencies:
  - python=3.11
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - cuda-libraries-dev=11.8
  - gxx_linux-64=11
  - ninja
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1
      - numpy
      - tifffile
      - pillow
      - h5py
      - pytest
